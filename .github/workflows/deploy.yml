name: CI/CD

# One pipeline for the whole stack:
#   PR to main      -> tests + image builds (no push, no deploy)
#   push to main    -> tests + build & push all images to GHCR + deploy to the VPS
#   manual dispatch -> same as push (redeploy)
#
# Server one-time setup: deploy/bootstrap.sh. Secrets/vars: deploy/README.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never kill a deploy halfway

env:
  REGISTRY: ghcr.io

jobs:
  test-backend:
    name: Tests · backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: cd backend && pytest -q

  test-backtester:
    name: Tests · backtester
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/backtester/requirements.txt
      - run: pip install -r services/backtester/requirements.txt
      - run: cd services/backtester && pytest test_indicators.py -q

  build:
    name: Build · ${{ matrix.name }}
    needs: [test-backend, test-backtester]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: execution
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: signals
            context: ./services/signals
            dockerfile: ./services/signals/Dockerfile
          - name: price-tracker
            context: ./services/price-tracker
            dockerfile: ./services/price-tracker/Dockerfile
          - name: backtester-web
            context: ./services/backtester
            dockerfile: ./services/backtester/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Only the frontend reads these (Next.js bakes NEXT_PUBLIC_* at build time)
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.DOMAIN }}
            NEXT_PUBLIC_WS_URL=wss://${{ vars.DOMAIN }}
            NEXT_PUBLIC_SIGNALS_URL=https://signals.${{ vars.DOMAIN }}
            NEXT_PUBLIC_BACKTESTER_URL=https://backtester.${{ vars.DOMAIN }}

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose + configs
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.yml,monitoring/,services/backtester/init-db.sql"
          target: /opt/trading-platform

      - name: Write .env, pull, restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
          TAG: sha-${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOMAIN: ${{ vars.DOMAIN }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SIGNALS_DB_USER: ${{ secrets.SIGNALS_DB_USER }}
          SIGNALS_DB_PASSWORD: ${{ secrets.SIGNALS_DB_PASSWORD }}
          BACKTESTER_DB_PASSWORD: ${{ secrets.BACKTESTER_DB_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_PREFIX,TAG,GHCR_USER,GHCR_TOKEN,DOMAIN,DB_USER,DB_PASSWORD,SIGNALS_DB_USER,SIGNALS_DB_PASSWORD,BACKTESTER_DB_PASSWORD,SECRET_KEY,ENCRYPTION_KEY,ADMIN_USERNAME,GRAFANA_PASSWORD
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/trading-platform
            IMAGE_PREFIX=$(echo "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')

            # .env is rebuilt from GitHub secrets on every deploy (single source of truth).
            # Values are single-quoted so compose does not interpolate '$' inside them.
            umask 077
            cat > .env <<EOF
            DOMAIN='${DOMAIN}'
            POSTGRES_USER='${DB_USER}'
            POSTGRES_PASSWORD='${DB_PASSWORD}'
            POSTGRES_DB='trading_db'
            DATABASE_URL='postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/trading_db'
            REDIS_URL='redis://redis:6379/0'
            SECRET_KEY='${SECRET_KEY}'
            ENCRYPTION_KEY='${ENCRYPTION_KEY}'
            ADMIN_USERNAME='${ADMIN_USERNAME}'
            BYBIT_TESTNET='false'
            CRYPTORG_BASE_URL='https://api2.cryptorg.net'
            BACKEND_CORS_ORIGINS='["https://${DOMAIN}"]'
            PRICE_TRACKER_URL='http://price-tracker:8010'
            SIGNALS_DB_USER='${SIGNALS_DB_USER}'
            SIGNALS_DB_PASSWORD='${SIGNALS_DB_PASSWORD}'
            SIGNALS_CORS_ORIGINS='https://${DOMAIN}'
            BACKTESTER_DB_USER='backtester'
            BACKTESTER_DB_PASSWORD='${BACKTESTER_DB_PASSWORD}'
            BACKTESTER_CORS_ORIGINS='https://${DOMAIN}'
            GRAFANA_PASSWORD='${GRAFANA_PASSWORD}'
            BACKEND_IMAGE='${IMAGE_PREFIX}-execution:${TAG}'
            FRONTEND_IMAGE='${IMAGE_PREFIX}-frontend:${TAG}'
            SIGNALS_IMAGE='${IMAGE_PREFIX}-signals:${TAG}'
            PRICE_TRACKER_IMAGE='${IMAGE_PREFIX}-price-tracker:${TAG}'
            BACKTESTER_IMAGE='${IMAGE_PREFIX}-backtester-web:${TAG}'
            EOF
            sed -i 's/^[[:space:]]*//' .env

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull --quiet
            # Backend entrypoint runs `alembic upgrade head` on start
            docker compose up -d --no-build --remove-orphans
            docker logout ghcr.io

            echo "Waiting for backend health..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
                echo "Backend healthy"; break
              fi
              if [ "$i" = 30 ]; then
                docker compose ps
                docker compose logs --tail=100 backend
                exit 1
              fi
              sleep 4
            done

            docker compose ps
            docker image prune -af --filter "until=168h" >/dev/null
            echo "Deployed ${TAG}"

      - name: Public health check
        run: curl -fsS --retry 5 --retry-delay 5 "https://${{ vars.DOMAIN }}/health"
