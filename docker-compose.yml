version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading123}
      POSTGRES_DB: ${POSTGRES_DB:-trading_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading_network
    logging:
      driver: json-file
      options:
        tag: "trading_postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trading_network
    logging:
      driver: json-file
      options:
        tag: "trading_redis"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/amraul/trading-platform-execution:latest}
    container_name: trading_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - trading_network
    logging:
      driver: json-file
      options:
        tag: "trading_backend"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No --reload / bind-mounted ./backend here — this is production. --reload
    # watches the filesystem and restarts the whole process on any file
    # change, which wipes all in-memory bot state (registered_bots,
    # strategy_engines) without warning: WAITING/PYRAMIDING bots silently
    # stop receiving price ticks until something re-registers them. Bind-
    # mounting ./backend also shadowed the built image's code with whatever
    # happened to be on the host, and any touch to those files (even an
    # unrelated one) could trigger a reload. The image already has the code
    # baked in — no mount, no --reload, uses the Dockerfile's default CMD.

  frontend:
    image: ${FRONTEND_IMAGE:-trading-platform-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - trading_network
    logging:
      driver: json-file
      options:
        tag: "trading_frontend"
    depends_on:
      - backend

  kandle-mcp:
    # Удалённый MCP для claude.ai / мобильного Claude: ходит в backend по внутренней сети
    # с логином пользователя; авторизация клиента — секрет в пути /mcp/<KANDLE_MCP_TOKEN>.
    image: ${KANDLE_MCP_IMAGE:-ghcr.io/amraul/trading-platform-kandle-mcp:latest}
    container_name: trading_kandle_mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8030:8030"
    environment:
      - KANDLE_URL=http://backend:8000
      - KANDLE_USERNAME=${KANDLE_MCP_USERNAME:-}
      - KANDLE_PASSWORD=${KANDLE_MCP_PASSWORD:-}
      - KANDLE_MCP_TOKEN=${KANDLE_MCP_TOKEN:-}
    networks:
      - trading_network
    logging:
      driver: json-file
      options:
        tag: "trading_kandle_mcp"
    depends_on:
      - backend

  alerter:
    # Telegram-алерты: /health и bots-health бэкенда раз в 5 минут. Отдельно от backend,
    # чтобы сообщить и о его падении.
    image: ${ALERTER_IMAGE:-ghcr.io/amraul/trading-platform-alerter:latest}
    container_name: trading_alerter
    restart: unless-stopped
    environment:
      - KANDLE_URL=http://backend:8000
      - KANDLE_USERNAME=${KANDLE_MCP_USERNAME:-}
      - KANDLE_PASSWORD=${KANDLE_MCP_PASSWORD:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    networks:
      - trading_network
    logging:
      driver: json-file
      options:
        tag: "trading_alerter"
    depends_on:
      - backend

  backup:
    # Ежедневный зашифрованный дамп trading_db и signals_db в Telegram-канал + 7 копий на сервере.
    # Ручной запуск: docker exec trading_backup python backup.py now. Восстановление: services/backup/README.md
    image: ${BACKUP_IMAGE:-ghcr.io/amraul/trading-platform-backup:latest}
    container_name: trading_backup
    restart: unless-stopped
    environment:
      - BACKUP_TARGETS=trading=${DATABASE_URL:-};signals=postgresql://${SIGNALS_DB_USER:-signals}:${SIGNALS_DB_PASSWORD:-signals123}@signals-db:5432/signals_db
      - BACKUP_PASSPHRASE=${BACKUP_PASSPHRASE:-}
      - BACKUP_HOUR_UTC=3
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_BACKUP_CHAT_ID=${TELEGRAM_BACKUP_CHAT_ID:-}
    volumes:
      - backups_data:/backups
    networks:
      - trading_network
    logging:
      driver: json-file
      options:
        tag: "trading_backup"
    depends_on:
      - postgres
      - signals-db

  signals-db:
    image: postgres:16-alpine
    container_name: trading_signals_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SIGNALS_DB_USER:-signals}
      POSTGRES_PASSWORD: ${SIGNALS_DB_PASSWORD:-signals123}
      POSTGRES_DB: signals_db
    volumes:
      - signals_db_data:/var/lib/postgresql/data
    networks:
      - trading_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signals -d signals_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  signals:
    image: ${SIGNALS_IMAGE:-ghcr.io/amraul/trading-platform-signals:latest}
    container_name: trading_signals
    restart: unless-stopped
    ports:
      - "127.0.0.1:8020:8020"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${SIGNALS_DB_USER:-signals}:${SIGNALS_DB_PASSWORD:-signals123}@signals-db:5432/signals_db
      - BYBIT_TESTNET=${BYBIT_TESTNET:-false}
      - CORS_ORIGINS=${SIGNALS_CORS_ORIGINS:-http://localhost:3000}
    networks:
      - trading_network
    logging:
      driver: json-file
      options:
        tag: "trading_signals"
    depends_on:
      signals-db:
        condition: service_healthy

  price-tracker:
    image: ${PRICE_TRACKER_IMAGE:-ghcr.io/amraul/trading-platform-price-tracker:latest}
    container_name: trading_price_tracker
    restart: unless-stopped
    expose:
      - "8010"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - BYBIT_TESTNET=${BYBIT_TESTNET:-false}
    networks:
      - trading_network
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        tag: "trading_price_tracker"

  backtester-postgres:
    image: postgres:15-alpine
    container_name: backtester_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: backtester
      POSTGRES_USER: ${BACKTESTER_DB_USER:-backtester}
      POSTGRES_PASSWORD: ${BACKTESTER_DB_PASSWORD:-changeme}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - backtester_postgres_data:/var/lib/postgresql/data
      - ./services/backtester/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trading_network
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          pg_isready -U ${BACKTESTER_DB_USER:-backtester} && \
          psql -U ${BACKTESTER_DB_USER:-backtester} -d backtester -tAc "SELECT EXISTS(SELECT 1 FROM information_schema.schemata WHERE schema_name = 'backtester');" | grep -q 't'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backtester-web:
    image: ${BACKTESTER_IMAGE:-ghcr.io/amraul/trading-platform-backtester-web:latest}
    build:
      context: .  # нужен backend/app/domain (логика позиции бота) — см. Dockerfile.web
      dockerfile: services/backtester/Dockerfile.web
    container_name: backtester_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./services/backtester/data:/app/data
      - ./services/backtester/reports:/app/reports
      - ./services/backtester/logs:/app/logs
      - ./services/backtester/results:/app/results
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_ENV=production
      - DATABASE_URL=postgresql+psycopg2://${BACKTESTER_DB_USER:-backtester}:${BACKTESTER_DB_PASSWORD:-changeme}@backtester-postgres:5432/backtester
      - CORS_ALLOWED_ORIGINS=${BACKTESTER_CORS_ORIGINS:-http://localhost:3000}
    # Тяжёлый прогон/оптимизация не должны отнимать процессор и память у ботов (VPS 2 vCPU / 4 ГБ):
    # не больше одного ядра и 1.5 ГБ, а при конкуренции за CPU бэкенд в приоритете (cpu_shares).
    cpus: 1.0
    mem_limit: 1536m
    memswap_limit: 1536m
    cpu_shares: 256
    depends_on:
      backtester-postgres:
        condition: service_healthy
    networks:
      - trading_network
    logging:
      driver: json-file
      options:
        tag: "backtester_web"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:2.9.4
    container_name: trading_loki
    restart: unless-stopped
    expose:
      - "3100"
    volumes:
      - loki_data:/loki
    networks:
      - trading_network

  promtail:
    image: grafana/promtail:2.8.0
    container_name: trading_promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
    networks:
      - trading_network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.6.0
    container_name: trading_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SERVER_ROOT_URL=https://logs.${DOMAIN:-localhost}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-lokiexplore-app
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-lokiexplore-app
    networks:
      - trading_network
    depends_on:
      - loki

networks:
  trading_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data:
  signals_db_data:
  backtester_postgres_data:
  backups_data:
